services:
  voice-service:
    build:
      context: .
      dockerfile: Dockerfile.voice-service
    restart: unless-stopped
    env_file:
      - tsbot.env
    ports:
      - "50051:50051"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - voicetmp:/app/tmp

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - tsbot.env
    environment:
      TSBOT_HOST: 0.0.0.0
      TSBOT_PORT: 8009
      TSBOT_VOICE_GRPC_ADDR: voice-service:50051
      DATABASE_URL: sqlite:///./data/tsbot.db
    depends_on:
      - voice-service
    ports:
      - "8009:8009"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - voicetmp:/app/tmp

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  voicetmp:
